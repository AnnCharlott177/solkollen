<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Solkollen – se vädret just nu och fem dagar framåt för dina favoritorter." />
    <meta name="theme-color" content="#ff8a3d" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Solkollen – väder för dina orter</title>
    <script>
      // Sätt temat direkt, innan appen laddats, så att sidan inte blinkar till i fel läge
      try {
        var tema = JSON.parse(localStorage.getItem('solkollen.tema'))
        if (!tema) tema = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = tema
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
